<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d10" />
    <title>Joy</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app">
      <!-- 侧栏：会话 + 能力中心。记忆、用量、模型、定时、审批审计都是配置，不占人的注意力；
           技能和 MCP 连接器不是配置旁观项 —— 是人要自己增删的东西，所以占一个入口。 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="dot" aria-hidden="true"></span>
          <h1>Joy</h1>
        </div>

        <!-- 新建会话是聊天应用的标配：一屏一目标，旧会话留在下面随时能切回去。 -->
        <button class="new-chat" id="new-session" type="button" title="新建一个会话">
          <span aria-hidden="true">＋</span> 新建会话
        </button>

        <div class="rail-block">
          <p class="rail-label">会话</p>
          <ul class="session-list" id="sessions"></ul>
        </div>

        <!-- 能力中心：三个入口对应抽屉里的三个面板。随 Joy 内置分发的技能/连接器
             在那里置灰（只读），用户自己的（<home>/skills、mcp.json）才能加和删；
             定时任务写的是 <home>/schedules.json，技能带的 schedule 行只读。 -->
        <div class="rail-block cap-block">
          <p class="rail-label">能力中心</p>
          <button
            class="cap-entry"
            id="cap-skills"
            type="button"
            title="技能：Joy 会的做法（SKILL.md）"
          >
            <span class="cap-entry-name">技能</span>
            <span class="cap-count" id="cap-skills-count">0</span>
          </button>
          <button
            class="cap-entry"
            id="cap-mcp"
            type="button"
            title="MCP 连接器：接进来的外部工具"
          >
            <span class="cap-entry-name">MCP 连接器</span>
            <span class="cap-count" id="cap-mcp-count">0</span>
          </button>
          <button
            class="cap-entry"
            id="cap-schedules"
            type="button"
            title="定时任务：到点在自己的会话里跑一轮"
          >
            <span class="cap-entry-name">定时任务</span>
            <span class="cap-count" id="cap-schedules-count">0</span>
          </button>
        </div>

        <div class="sidebar-foot">
          <div class="foot-row">
            <span class="stamp" id="stamp"></span>
            <button class="ghost" id="refresh" type="button">刷新</button>
          </div>
        </div>

        <!-- 边界抓手：骑在侧栏右边框上，拖动调宽窄；双击复位。 -->
        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          aria-label="拖动调整侧栏宽度（双击复位，方向键微调）"
        ></div>
      </aside>

      <!-- 主对话区：工作目录是点一下就能选的文件夹，交付结果就落在消息流里。
           没有单独的目标栏 —— 目标就是你说的话，何必再说一遍。 -->
      <main class="chat">
        <div class="bar">
          <p class="hint">
            会话 · <code id="session" title="默认会话跟终端里的 joy 是同一条线">—</code>
          </p>
          <button
            class="ws-chip"
            id="cwd"
            type="button"
            title="选一个文件夹作为工作目录——它同时也是唯一的可写范围"
          >
            <span class="ws-folder" aria-hidden="true">▤</span>
            <span id="cwd-label">选择工作目录</span>
          </button>
          <button class="ghost" id="progress" type="button">进度</button>
          <button class="ghost" id="older" type="button" hidden>更早的 ↑</button>
        </div>
        <div class="messages" id="messages" aria-live="polite" aria-label="对话"></div>
        <div class="statusline" id="status" hidden aria-live="polite"></div>
        <!-- 附件条是输入框的**兄弟**，不是 flex 子项：无论 CSS 有没有换行规则，
             它都不会跟 textarea 抢同一行的宽度。宽度写在这里，是为了连旧缓存里的
             CSS（只认 .chat > .composer）也能让输入区保持居中。 -->
        <div class="composer-wrap" style="width: 100%; max-width: 760px; margin: 0 auto">
          <div class="staged" id="staged" hidden></div>
          <form class="composer" id="composer" autocomplete="off">
            <input id="file" type="file" multiple hidden />
            <button
              class="ghost attach"
              id="attach"
              type="button"
              title="附上文件（20MB 以内；模型会自己去读）"
            >
              ＋
            </button>
            <textarea
              id="input"
              rows="1"
              placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
              aria-label="消息"
            ></textarea>
            <button
              class="ghost queue-toggle"
              id="queue-toggle"
              type="button"
              title="这一轮跑完，再把这句话当成新的一轮发出去"
              aria-pressed="false"
              hidden
            >
              跑完再说
            </button>
            <button id="send" type="submit">发送</button>
          </form>
        </div>
      </main>

      <!-- 抽屉：三个面板（概览 / 技能 / MCP 连接器），聊天列永远不被挤压。
           审批卡片在聊天窗口里，不在这里。 -->
      <aside class="panels" id="drawer" hidden>
        <div class="drawer-head">
          <div class="drawer-tabs" role="tablist" aria-label="面板">
            <button
              class="drawer-tab active"
              id="tab-overview"
              type="button"
              role="tab"
              aria-selected="true"
            >
              概览
            </button>
            <button
              class="drawer-tab"
              id="tab-skills"
              type="button"
              role="tab"
              aria-selected="false"
            >
              技能
            </button>
            <button
              class="drawer-tab"
              id="tab-mcp"
              type="button"
              role="tab"
              aria-selected="false"
            >
              MCP
            </button>
            <button
              class="drawer-tab"
              id="tab-memory"
              type="button"
              role="tab"
              aria-selected="false"
            >
              记忆
            </button>
            <button
              class="drawer-tab"
              id="tab-schedule"
              type="button"
              role="tab"
              aria-selected="false"
            >
              定时
            </button>
          </div>
          <button class="ghost" id="drawer-close" type="button" aria-label="收起">×</button>
        </div>
        <section class="panel" id="panel-overview" role="tabpanel">
          <div class="body" id="overview"></div>
        </section>
        <section class="panel" id="panel-skills" role="tabpanel" hidden>
          <div class="body" id="skills-body"></div>
        </section>
        <section class="panel" id="panel-mcp" role="tabpanel" hidden>
          <div class="body" id="mcp-body"></div>
        </section>
        <!-- 记忆中心：三个只读视图，一次只看一段。账本是事实（一轮一行，点开看结构），
             记忆库是派生知识（左目录右正文，出处可跳回账本），上下文是代价（一条分层条）。 -->
        <section class="panel" id="panel-memory" role="tabpanel" hidden>
          <div class="mem-segs" role="tablist" aria-label="记忆视图">
            <button
              class="mem-seg active"
              id="mem-seg-ledger"
              type="button"
              role="tab"
              aria-selected="true"
            >
              账本
            </button>
            <button
              class="mem-seg"
              id="mem-seg-wiki"
              type="button"
              role="tab"
              aria-selected="false"
            >
              记忆库
            </button>
            <button
              class="mem-seg"
              id="mem-seg-context"
              type="button"
              role="tab"
              aria-selected="false"
            >
              上下文
            </button>
          </div>
          <div class="body" id="mem-ledger"></div>
          <div class="body" id="mem-wiki" hidden></div>
          <div class="body" id="mem-context" hidden></div>
        </section>
        <!-- 定时任务：声明（文件 + 技能）与运行状态合在一张表里。它是「我让它按点做什么」，
             和能力中心另外两块同属一个抽屉：都是人能加、能删的东西。 -->
        <section class="panel" id="panel-schedule" role="tabpanel" hidden>
          <div class="body" id="schedules-body"></div>
        </section>
      </aside>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
