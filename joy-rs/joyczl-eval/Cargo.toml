[package]
name = "joyczl-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evaluation: deterministic evals (offline, 0/1), the judge (an LLM scoring), and the release gate."

[lib]
name = "joyczl_eval"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
joyczl-app-server = { workspace = true }
joyczl-config = { workspace = true }
joyczl-protocol = { workspace = true }
joyczl-provider = { workspace = true }
joyczl-state = { workspace = true }
# The "sandbox" prereq asks the exec module one thing: is there a usable sandbox on this
# machine?
joyczl-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A fresh temporary home per case, so one state.db never flavours another.
tempfile = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
joyczl-memory = { workspace = true }

[lints]
workspace = true
