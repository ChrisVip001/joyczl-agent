[package]
name = "joyczl-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "全部配置都是环境变量，读一次，不再有设置框架。"

[lib]
name = "joyczl_config"
path = "src/lib.rs"
doctest = false

[dependencies]
joyczl-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# 只在 Windows 编译：钥匙串走 Credential Manager（keyring crate，CredWrite/CredRead）。
# macOS/Linux 的命令行路径（security / secret-tool）已上过线，不换实现。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
