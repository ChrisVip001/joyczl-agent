[package]
name = "joyczl-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "All configuration is environment variables, read once, with no settings framework."

[lib]
name = "joyczl_config"
path = "src/lib.rs"
doctest = false

[dependencies]
joyczl-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Compiled on Windows only: the keychain goes through Credential Manager (the keyring crate,
# CredWrite/CredRead). The macOS/Linux command-line path (security / secret-tool) has shipped,
# so its implementation stays.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
