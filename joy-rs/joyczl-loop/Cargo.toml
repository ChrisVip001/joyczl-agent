[package]
name = "joyczl-loop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "THE LOOP — observe → reason → act → repeat. The core mechanism of the whole agent."

[lib]
name = "joyczl_loop"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
joyczl-provider = { workspace = true }
joyczl-tools = { workspace = true }
