#   macros  = tokio::select! (racing the model call / tool run against the cancellation)
tokio = { workspace = true }

[dev-dependencies]
joyczl-state = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
