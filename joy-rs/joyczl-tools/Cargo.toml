[package]
name = "joyczl-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What Joy can do: the model reads the schema, Rust does the work."

[lib]
name = "joyczl_tools"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
joyczl-agent = { workspace = true }
joyczl-config = { workspace = true }
joyczl-memory = { workspace = true }
jsonschema = { workspace = true }
joyczl-provider = { workspace = true }
joyczl-schedule = { workspace = true }
joyczl-state = { workspace = true }
serde_json = { workspace = true }
#   Both search_web backends speak HTTP: Tavily is a JSON API, DuckDuckGo means fetching a page
#   of HTML and picking it apart. One reqwest, no second client.
reqwest = { workspace = true }
#   osascript is a child process (Apple Calendar sync goes through AppleScript).
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
