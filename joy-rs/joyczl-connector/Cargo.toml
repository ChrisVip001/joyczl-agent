[package]
name = "joyczl-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Connectors: let Joy act in the outside world on a human's behalf, one nod at a time."

[lib]
name = "joyczl_connector"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
# base64 is needed for MIME encoding (subject headers / body transfer-encoding) and AUTH PLAIN;
# it is long since in the tree (app-server uploads), so nothing new to compile.
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
# Only for Tool / ToolCtx: a connector shows up as an ordinary tool, and the registry validates
# its arguments and puts it through the same approval gate as any other.
joyczl-tools = { workspace = true }
joyczl-config = { workspace = true }
joyczl-state = { workspace = true }
# reqwest has been in the tree for a while (gateway / MCP); the two Feishu endpoints are its
# most ordinary use.
reqwest = { workspace = true }
tokio = { workspace = true }
# TLS is only for SMTP (465 implicit TLS / 587 STARTTLS). rustls already arrives via reqwest;
# declaring it here makes «who uses it» answerable — no native-tls, no system OpenSSL.
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
joyczl-state = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
