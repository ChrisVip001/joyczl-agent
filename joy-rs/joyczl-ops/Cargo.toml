[package]
name = "joyczl-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "驾驶舱的 HTTP 面：axum + SSE，把浏览器接到 app-server 上。"

[lib]
name = "joyczl_ops"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
joyczl-config = { workspace = true }
joyczl-connector = { workspace = true }
joyczl-mcp = { workspace = true }
joyczl-memory = { workspace = true }
joyczl-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
# token 生成用：已在依赖树里（sqlx/tokio 传递引入），不是新 crate。
getrandom = "0.3"
# 密码哈希（PBKDF2-HMAC-SHA256）与 webhook 的 HMAC-SHA256：ring 已在依赖树里（reqwest → rustls）。
ring = "0.17"
# webhook 的异步回调：POST 一条结果。reqwest 早就在树里（网关 / MCP / 飞书），不是新编译物。
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
