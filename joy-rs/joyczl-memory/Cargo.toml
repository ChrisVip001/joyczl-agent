[package]
name = "joyczl-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Two agents that manage memory: the retrieval gate (should it look?) and consolidation (what to keep)."

[lib]
name = "joyczl_memory"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
joyczl-provider = { workspace = true }
joyczl-state = { workspace = true }
# `joy skill install <url>` fetches the raw SKILL.md; reqwest is long since in the tree (the
# provider uses it), so nothing new to compile.
reqwest = { workspace = true }
# Row digests (sha256) for memory pages and the ledger; already in the workspace.
sha2 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
