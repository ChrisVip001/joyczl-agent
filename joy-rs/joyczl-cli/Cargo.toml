[package]
name = "joyczl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `joy` command-line entry point."

# The binary is just `joy`: a persona's name, short and easy to type.
[[bin]]
name = "joy"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
joyczl-app-server = { workspace = true }
joyczl-config = { workspace = true }
joyczl-schedule = { workspace = true }
joyczl-connector = { workspace = true }
joyczl-eval = { workspace = true }
joyczl-graph = { workspace = true }
joyczl-memory = { workspace = true }
joyczl-mcp = { workspace = true }
joyczl-ops = { workspace = true }
joyczl-protocol = { workspace = true }
joyczl-provider = { workspace = true }
joyczl-state = { workspace = true }
joyczl-tools = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
#  the schedule tests need a real temporary home.
tempfile = { workspace = true }
