[workspace]
resolver = "2"
members = [
    "joyczl-protocol",
    "joyczl-schedule",
    "joyczl-protocol-noop-macros",
    "joyczl-config",
    "joyczl-provider",
    "joyczl-tools",
    "joyczl-connector",
    "joyczl-loop",
    "joyczl-graph",
    "joyczl-mcp",
    "joyczl-memory",
    "joyczl-state",
    "joyczl-agent",
    "joyczl-eval",
    "joyczl-app-server",
    "joyczl-ops",
    "joyczl-cli",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# ---- Runtime dependencies: deliberately tiny ---------------------------------
anyhow = "1"
# Kernel-backed runtime ownership, compatible with the workspace Rust 1.85 minimum.
fs2 = "0.4.3"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
#   process = the MCP client starts servers as child processes (the stdio route)
#   sync    = a few connections get shared across tool calls (tokio::sync::Mutex)
#   time    = how the graph's parallel waves prove they really ran at once
#   net     = the dashboard's HTTP listener (TcpListener)
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
# JSON Schema validation of tool arguments: when the model's arguments are invalid the error has
# to name the field and the expected value. Default features are off — we have no use for the
# resolve-http/file remote references (every schema is a local literal).
jsonschema = { version = "0.56", default-features = false }

# Token estimation: compaction triggers on «how close to the context limit», not on round count.
# A cross-vendor approximation (the cl100k encoder); the exact figure stays whatever usage the
# provider reports. Default features off: cl100k_base only, with the BPE table compiled in, so
# nothing touches the network.
tiktoken-rs = { version = "0.12", default-features = false }

# Outside test builds `#[derive(TS)]` / `#[derive(JsonSchema)]` become empty macros, so the
# protocol crate need not carry ts-rs / schemars into the shipped binary.
joyczl-protocol-noop-macros = { path = "joyczl-protocol-noop-macros" }
joyczl-protocol = { path = "joyczl-protocol" }
joyczl-schedule = { path = "joyczl-schedule" }
joyczl-state = { path = "joyczl-state" }
joyczl-config = { path = "joyczl-config" }
joyczl-provider = { path = "joyczl-provider" }
joyczl-tools = { path = "joyczl-tools" }
joyczl-connector = { path = "joyczl-connector" }
joyczl-loop = { path = "joyczl-loop" }
joyczl-graph = { path = "joyczl-graph" }
joyczl-mcp = { path = "joyczl-mcp" }
joyczl-memory = { path = "joyczl-memory" }
joyczl-agent = { path = "joyczl-agent" }
joyczl-eval = { path = "joyczl-eval" }
joyczl-app-server = { path = "joyczl-app-server" }
joyczl-ops = { path = "joyczl-ops" }

# HTTP client: it only ever talks to LLM APIs. rustls rather than native-tls, which drops the
# system OpenSSL build dependency. stream: SSE streaming (what the dashboard's typewriter rests
# on).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
# Stream iteration (Stream / StreamExt / unfold) and Bytes. futures-util on purpose rather than
# the whole `futures` family: the latter turns the async-await macros on by default, which drags
# in futures-macro =0.3.34 — a version crates.io no longer serves, so resolution fails outright.
# We use Stream/StreamExt/unfold and nothing that wants a macro.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

# The PKCE S256 challenge (MCP OAuth, see joyczl-mcp/src/oauth.rs).
sha2 = "0.10"

# SQLite。
#   Queries always go through the runtime API (`sqlx::query` / `query_as`), never the
#   `sqlx::query!` macro: that one wants a live database at compile time, or a
#   `cargo sqlx prepare` step producing sqlx-data.json — a burden for a project that should
#   build straight after a clone.
#   derive  = `#[derive(FromRow)]`, mapping a row onto a struct
#   macros  = only for `sqlx::migrate!`, which reads the .sql files under migrations/ at compile
#             time with no database needed, so the binary carries its own schema
#   default-features = false: no any/mysql/postgres/json, sqlite only
sqlx = { version = "0.8", default-features = false, features = [
    "derive",
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }

# The HTTP server (joyczl-ops only: the dashboard's cockpit page).
#   axum = routing + SSE + JSON, thin by itself: the rule is «use hyper, do not build another
#   framework».
#   tower-http's fs = static files, **not written by hand**: the most dangerous thing in a static
#   file server is path traversal (`GET /../../.env`), which has been got right countless times;
#   there is no reason to write it once more.
#   set-header = no-cache for static files: the front end still changes daily, and browser
#   caching turns «but I did change it» into a ten-minute ghost story.
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header", "cors"] }

# ---- Code generation / tests only ------------------------------------------
# TypeScript bindings
#   serde-json-impl: gives `serde_json::Value` a TS implementation too (otherwise an arbitrary
#                    JSON field in the protocol does not compile)
#   no-serde-warnings: ts-rs spams warnings whenever it cannot parse an attribute such as
#                    `skip_serializing_if`
# `format` stays off: it drags in dprint-plugin-typescript → swc_common, and the latter is
# incompatible with serde 1.0.229 (it uses the already-moved serde::__private). The artefacts are
# post-processed with node's prettier instead, see scripts/write_schema.py.
ts-rs = { version = "10", features = ["serde-json-impl", "no-serde-warnings"] }
# JSON Schema (the Python SDK's pydantic models are generated from it)
schemars = "0.8"
tempfile = "3"

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
# The protocol is pure data: a readable name beats a memory layout
enum_variant_names = "allow"

# ---- Build size --------------------------------------------------------------
# The default dev profile gives each of 300 dependencies a full DWARF: one clean
# `cargo build -p joyczl-cli` comes to 2.0G, and `cargo test --workspace` stacks another layer.
# Debug info for dependencies is almost never used (nobody steps into reqwest); our own crates
# keep their line tables, so `RUST_BACKTRACE=1` still points at a source line — measured, a clean
# build drops from 2.0G to about 1.2G.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
