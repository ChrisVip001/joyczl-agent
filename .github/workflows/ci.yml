name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy-rs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-coverage:
    # A trend gate, not a target. The threshold follows the **measured baseline**: one local
    # `cargo llvm-cov --workspace --summary-only` came out at 65.9% line coverage, so the gate
    # sits at 60 — low but true. Set it high and it only forces «tests written to pass the
    # gate», which is worse than no gate.
    name: Rust (coverage floor 60%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy-rs
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 60 --summary-only

  windows:
    # Record the platform boundary explicitly rather than pretend to support it: the exec sandbox
    # is Unix-only (macOS seatbelt / Linux bubblewrap), and anything needing a real sandbox is
    # skipped. This job only proves that **everything but the sandbox** builds and passes on
    # Windows too.
    name: Windows (build + tests, sandbox tests not applicable)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: joy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy-rs
      - run: cargo build -p joyczl-cli
      # joyczl-tools is excluded wholesale: the exec sandbox backend does not exist on Windows,
      # and some of its tests really start one.
      - run: cargo test --workspace --exclude joyczl-tools
      - run: cargo test -p joyczl-tools -- --skip sandbox --skip spill

  schema:
    name: Protocol artifacts (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/write_schema.py --check

  docs:
    name: Tool docs (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tool count lives in the code, in 06-tools.md §6.0 and in both READMEs.
      # Three copies drift; this is the one that notices. No build needed: it reads text.
      - run: python3 scripts/check_tool_docs.py
      # Same idea one level down: the dashboard's dictionary vs. the strings its code uses.
      - run: python3 scripts/check_i18n.py

  ts:
    name: TypeScript (typecheck / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: joy-ts
      - run: npm run typecheck
        working-directory: joy-ts
      - run: npm test
        working-directory: joy-ts

  python:
    # mypy runs with `strict = true` (see pyproject.toml): type annotations are what this SDK
    # sells. Coverage is a trend gate too, threshold 60 against the measured baseline (63%);
    # generated code is not in the denominator.
    name: Python SDK (mypy strict / pytest + coverage floor 60%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: sdk/python
      - run: uv run mypy src/joyczl_agent tests
        working-directory: sdk/python
      - run: uv run coverage run -m pytest
        working-directory: sdk/python
      - run: uv run coverage report --fail-under=60
        working-directory: sdk/python

  gate:
    name: Release gate (deterministic evals + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p joyczl-cli
      # The dashboard/hub leg of the smoke test needs a real dist — and the freshness guard
      # makes a hub whose sources are newer than dist, or that has no dist at all, refuse to
      # start (fail-closed), so the build has to happen first. The justfile's
      # `smoke-dashboard: build dashboard-build` spelled that dependency out; CI had missed it,
      # and the guard caught it on its first day.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm run build --workspace @joy/dashboard
        working-directory: joy-ts
      - run: ./target/debug/joy eval ../evals/deterministic
      # The smoke test runs the protocol over real processes: the evals use an in-process
      # scripted model, and this is the only leg that goes through a real app-server over real
      # stdio JSON-RPC. It guards the seam between Rust and the front end — that seam has leaked
      # before, and neither the unit tests nor the evals can see it.
      - run: bash ../scripts/smoke.sh
      # Exercise real process death; all provider and external effects are local fixtures.
      - run: python3 ../scripts/smoke-recovery.py
