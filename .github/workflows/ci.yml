name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy-rs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  schema:
    name: Protocol artifacts (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/write_schema.py --check

  ts:
    name: TypeScript (typecheck / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: joy-ts
      - run: npm run typecheck
        working-directory: joy-ts
      - run: npm test
        working-directory: joy-ts

  python:
    name: Python SDK (mypy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: sdk/python
      - run: uv run mypy src/joyczl_agent tests
        working-directory: sdk/python
      - run: uv run pytest
        working-directory: sdk/python

  gate:
    name: Release gate (deterministic evals + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: joy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p joyczl-cli
      - run: ./target/debug/joy eval ../evals/deterministic
      # 冒烟是在真进程上跑协议：eval 用的是进程内的 scripted 模型，唯有这一条
      # 走真的 app-server + 真的 stdio JSON-RPC。它守的是 Rust 与前端之间那条缝
      # —— 那条缝的漏出过事故，而单测和 eval 都看不见它。
      - run: bash ../scripts/smoke.sh
