# 发布 Joy 的二进制产物：四个平台的 `joy` + Python 轮子，挂到 GitHub Release 上。
# 由 tag（v*）触发。npm publish / PyPI upload 仍由人在有凭据的机器执行
# （见 packaging/RELEASING.md —— 凭据不该躺在 CI 里）。
name: release

on:
  push:
    tags: ["v*"]
  # Lets a maintainer re-run a failed publish without moving the tag.
  workflow_dispatch:

permissions:
  contents: write # 创建 Release、上传产物

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 13 镜像已于 2025-12-04 退役，继续用它会让 job 永远排队（v0.8.0
          # 挂满 24h 被取消、v0.16.0 排队 31h 未启动，release job 因此从未执行）。
          # 官方给 x86_64 的替代标签是 macos-15-intel（可用到 2027 年秋）。
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Linux 构建依赖（sqlite3 源码编译不需要系统库；bwrap 只在运行时需要）。
      - name: Build joy (${{ matrix.target }})
        working-directory: joy-rs
        run: cargo build --release --target ${{ matrix.target }} -p joyczl-cli
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "joy-rs/target/${{ matrix.target }}/release/joy" dist/joy
          cp README.md LICENSE dist/
          tar -czf "dist/joy-v${version}-${{ matrix.target }}.tar.gz" -C dist joy README.md LICENSE
          rm dist/joy dist/README.md dist/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: joy-${{ matrix.target }}
          path: dist/joy-v*.tar.gz

  pypi-wheels:
    # 每平台的原生 bin 轮子（joyczl-agent-bin）。runner 本身就是目标平台，无需交叉编译。
    # 上传（twine）由人执行 —— 凭据不进 CI。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos-arm64 }
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Build native bin wheel
        run: just build-python-bin
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: sdk/python-bin/dist/*.whl

  release:
    needs: [binaries, pypi-wheels]
    runs-on: ubuntu-24.04
    steps:
      # gh release create needs a git repository; without checkout it fails with
      # "fatal: not a git repository" (this is what broke the v0.17.0 run).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
