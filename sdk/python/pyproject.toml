[project]
name = "joyczl-agent"
version = "0.17.0"
description = "The Python client for Joy: start `joy app-server` and talk to it from Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# the `joy` binary. It is per-platform, so it lives in its own package (joyczl-agent-bin) and the
# main package can stay `py3-none-any`. Installing it is optional — the client falls back to
# $JOY_BIN / the repo's target dir / PATH.
bin = ["joyczl-agent-bin"]

[dependency-groups]
# only used when generating code. v2.py comes out of datamodel-codegen over the JSON Schema, and
# the version is pinned because a minor bump changes the output — and these files are committed.
dev = [
    "coverage>=7",
    "datamodel-code-generator==0.82.0",
    "mypy>=1.11",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# `joyczl-agent-bin` is not on any registry yet, so it is found locally. Without this block
# `uv run` (and with it our code generation) fails outright on an unresolvable optional dep.
joyczl-agent-bin = { path = "../python-bin", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/joyczl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Measure **our** code only: without `source`, coverage counts the tests themselves and whatever
# the environment imports along the way (an IDE-injected sitecustomize.py, say) in the
# denominator, and the resulting percentage is neither our level nor usable as a gate.
source = ["src/joyczl_agent"]
# Generated code does not count: it comes out of datamodel-codegen; it cannot be edited and must
# not be asked to reach a threshold.
omit = ["src/joyczl_agent/generated/*"]

[tool.coverage.report]
# A trend gate, not a target: falling below it means untested code got in this round.
show_missing = true

[tool.mypy]
# Development runs on 3.13, but this package claims 3.10 — and that gap is exactly how far the
# type syntax may go. Pinned here so it does not pass locally and blow up on 3.10.
python_version = "3.10"
# Type annotations are what this SDK sells; a forgotten one must not slip through.
strict = true
