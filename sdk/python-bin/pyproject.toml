[project]
name = "joyczl-agent-bin"
version = "0.17.0"
description = "The `joy` binary itself, for joyczl-agent to use"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyczl_agent_bin"]

# The binary is per-platform and so the wheel tag has to be — the default `py3-none-any` claims
# «this wheel runs anywhere», while what sits inside is an ELF that runs on one architecture.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
